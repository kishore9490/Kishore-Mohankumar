/* =============================================================================
   CALCULATION ENGINE — all totals COMPUTED, never hard-coded
============================================================================= */
const fx = ()=> Math.max(1, +S.meta.fx||90);
const mo2yr = 12;

function calculateHR(){
  const lf = +S.meta.loadFactor||1.4;
  let annual=0, headcount=0; const rows=[];
  S.hr.forEach(h=>{
    const loaded = (+h.salaryUSD||0)*(+h.count||0)*lf;
    annual += loaded; headcount += (+h.count||0);
    rows.push({...h, loadedAnnual:loaded});
  });
  return {annualUSD:annual, monthlyUSD:annual/12, headcount, rows};
}

function calculateAISubs(){
  const c = (+S.claude.users5x||0)*(+S.claude.price5x||0) + (+S.claude.users20x||0)*(+S.claude.price20x||0);
  const g = (+S.chatgpt.bizUsers||0)*(+S.chatgpt.bizPrice||0);
  const entQuote = (+S.chatgpt.entUsers||0)>0; // enterprise is QUOTE REQUIRED
  return {claudeMo:c, chatgptMo:g, monthlyUSD:c+g, entQuote};
}

function calculateProdAIPerClaim(){
  const m = S.prodAI;
  const routeSum = m.models.reduce((a,x)=>a+(+x.route||0),0)||1;
  const inTok=(+m.tokensInPerClaim||0)*(+m.aiActionsPerClaim||1);
  const outTok=(+m.tokensOutPerClaim||0)*(+m.aiActionsPerClaim||1);
  const cacheFac = m.caching ? (0.5*(+m.cacheReadMult||0.1)+0.5) : 1.0;
  let cost=0; const breakdown=[];
  m.models.forEach(x=>{
    const w=(+x.route||0)/routeSum;
    const ci = (inTok*w/1e6)*(+x.inP||0)*cacheFac;
    const co = (outTok*w/1e6)*(+x.outP||0);
    cost += ci+co; breakdown.push({name:x.name, route:x.route, cost:ci+co});
  });
  return {perClaim:cost, breakdown, routeSum};
}

function calculateVoicePerClaim(){
  return (+S.voice.escalationPct||0)/100*(+S.voice.minutesPerClaim||0)*(+S.voice.perMin||0);
}
function calculateDocPerClaim(){
  return (+S.doc.ocrRatePct||0)/100*(+S.doc.pagesPerClaim||0)*(+S.doc.per1k||0)/1000;
}
function calculateClearinghousePerClaim(){
  return (+S.clearinghouse.txnPerClaim||0)*(+S.clearinghouse.unitTxn||0);
}
function calculateConnectivityPerClaim(){
  const sum=S.connectivity.reduce((a,c)=>a+(+c.route||0),0)||1;
  let cost=0;
  S.connectivity.forEach(c=>{ cost += (+c.route||0)/sum*(+c.unit||0); });
  return cost;
}

function calculateUnitEconomics(){
  const ai=calculateProdAIPerClaim().perClaim;
  const voice=calculateVoicePerClaim();
  const doc=calculateDocPerClaim();
  const ch=calculateClearinghousePerClaim();
  const conn=calculateConnectivityPerClaim();
  const allIn = ai+voice+doc+ch;
  return {ai,voice,doc,ch,conn,allIn};
}

function calculateAzure(){
  const on = S.azure.services.filter(s=>s.on);
  const monthly = on.reduce((a,s)=>a+(+s.mo||0),0);
  return {monthlyUSD:monthly, services:on};
}

function calculateProdAIMonthly(){
  const per=calculateProdAIPerClaim().perClaim;
  const claims=+S.meta.claimsPerMonth||0;
  const voice=calculateVoicePerClaim()*claims;
  const doc=calculateDocPerClaim()*claims;
  const embed=+S.prodAI.embedMonthly||0;
  return {ai:per*claims, voice, doc, embed, total:per*claims+voice+doc+embed};
}
function calculateClearinghouseMonthly(){
  const claims=+S.meta.claimsPerMonth||0;
  if(S.clearinghouse.freeTierMVP && claims<=50000) return 0;
  return calculateClearinghousePerClaim()*claims;
}

function sumList(list){
  let oneTime=0, annual=0;
  list.forEach(x=>{ if(x.on===false) return; oneTime+=(+x.oneTime||0); annual+=(+x.annual||0); });
  return {oneTime, annual};
}
function calculateSecurity(){ return sumList(S.security); }
function calculateCompliance(){ return sumList(S.compliance); }
function calculateLegal(){ return sumList(S.legal); }

function calculateCustomItems(perMonthClaims){
  const claims=perMonthClaims??(+S.meta.claimsPerMonth||0);
  const users=calculateHR().headcount;
  const tenants=10; // reference tenant count for per-tenant items
  let oneTime=0, monthly=0, annual=0, quotes=[];
  S.customItems.forEach(it=>{
    if(it.on===false) return;
    const amt=+it.amount||0, qty=+it.qty||1;
    switch(it.type){
      case 'ONE-TIME': oneTime+=amt*qty; break;
      case 'MONTHLY': monthly+=amt*qty; break;
      case 'ANNUAL': annual+=amt*qty; break;
      case 'PER-USER': monthly+=amt*users; break;
      case 'PER-TENANT': monthly+=amt*tenants; break;
      case 'PER-CLAIM': monthly+=amt*claims; break;
      case 'PER-TRANSACTION': monthly+=amt*claims*(+S.clearinghouse.txnPerClaim||1); break;
      case 'PER-MINUTE': monthly+=amt*claims*(+S.voice.minutesPerClaim||0)*(+S.voice.escalationPct||0)/100; break;
      case 'PER-GB': monthly+=amt*qty; break;
      case 'PER-API-CALL': monthly+=amt*claims*(+S.prodAI.aiActionsPerClaim||1); break;
      case 'PERCENTAGE': /* applied at end to subtotal */ break;
      case 'QUOTE REQUIRED': quotes.push(it.name); break;
    }
  });
  return {oneTime, monthly, annual, quotes};
}

/* ---------- HEADLINE INVESTMENT (fully computed) ---------- */
function calculateInvestment(){
  const cont=(+S.meta.contingencyPct||0)/100;
  const buildMo=+S.meta.buildMonths||8;
  const prodMo=+S.meta.prodMonths||11.5;

  const hr=calculateHR();
  const subs=calculateAISubs();
  const azure=calculateAzure();
  const prodAI=calculateProdAIMonthly();
  const sec=calculateSecurity();
  const comp=calculateCompliance();
  const legal=calculateLegal();
  const custom=calculateCustomItems();
  const chMonthly=calculateClearinghouseMonthly();

  // MVP (one-time build phase ~buildMonths)
  const devCost = hr.monthlyUSD*buildMo;
  const azureBuild = azure.monthlyUSD*buildMo*0.7; // ramp factor
  const aiSubsBuild = subs.monthlyUSD*buildMo;
  const aiApiPilot = prodAI.total*3; // ~3 pilot months
  const chSetup = +S.development.clearinghouseSetup||0;
  const testing = +S.development.testingOneTime||0;
  const secOne = sec.oneTime + comp.oneTime + legal.oneTime;
  const secAnnMvp = (sec.annual+comp.annual+legal.annual)*(buildMo/12);
  const customBuild = custom.oneTime + custom.monthly*buildMo + custom.annual*(buildMo/12);
  const mvpSub = devCost+azureBuild+aiSubsBuild+aiApiPilot+chSetup+testing+secOne+secAnnMvp+customBuild;
  const mvp = mvpSub*(1+cont);
  const mvpParts = {Development:devCost, Azure:azureBuild, 'AI Subscriptions':aiSubsBuild,
    'Production AI':aiApiPilot, 'Security & Compliance':secOne+secAnnMvp, Legal:legal.oneTime,
    'Clearinghouse & Testing':chSetup+testing, Custom:customBuild, Contingency:mvpSub*cont};

  // 12-month (build + run)
  const team12=hr.annualUSD;
  const azure12=azure.monthlyUSD*12;
  const ai12=prodAI.total*12;
  const subs12=subs.monthlyUSD*12;
  const ch12=chMonthly*12;
  const sec12=sec.oneTime+comp.oneTime+legal.oneTime+(sec.annual+comp.annual+legal.annual);
  const custom12=custom.oneTime+custom.monthly*12+custom.annual;
  const other12=chSetup+testing;
  const sub12=team12+azure12+ai12+subs12+ch12+sec12+custom12+other12;
  const inv12=sub12*(1+cont);

  // 24-month (scale)
  const team24=hr.annualUSD*2*1.15; // team grows
  const azure24=azure.monthlyUSD*24*1.6;
  const ai24=prodAI.total*24*1.4;
  const subs24=subs.monthlyUSD*24;
  const ch24=chMonthly*24;
  const sec24=sec12+comp.oneTime*0.5+(sec.annual+comp.annual+legal.annual);
  const custom24=custom.oneTime+custom.monthly*24+custom.annual*2;
  const sub24=team24+azure24+ai24+subs24+ch24+sec24+custom24+other12;
  const inv24=sub24*(1+cont);

  return {
    mvp, mvpParts, inv12, inv24,
    monthlyBurn12: inv12/12,
    monthlyRun: hr.monthlyUSD+azure.monthlyUSD+prodAI.total+subs.monthlyUSD+chMonthly+
                (sec.annual+comp.annual+legal.annual)/12+custom.monthly,
    parts12:{Team:team12, Azure:azure12, 'Production AI':ai12, 'AI Subs':subs12,
             Clearinghouse:ch12, 'Security/Legal':sec12, Custom:custom12, Other:other12,
             Contingency:sub12*cont},
    hr, subs, azure, prodAI, sec, comp, legal, custom, chMonthly
  };
}

/* =============================================================================
   FORMATTING
============================================================================= */
function money(usd, opts={}){
  const v = S.meta.currency==='INR' ? usd*fx() : usd;
  const sym = S.meta.currency==='INR' ? '₹' : '$';
  const dp = opts.dp!==undefined?opts.dp:0;
  if(opts.compact && Math.abs(v)>=1000){
    if(Math.abs(v)>=1e7 && S.meta.currency==='INR') return sym+(v/1e7).toFixed(2)+' Cr';
    if(Math.abs(v)>=1e5 && S.meta.currency==='INR') return sym+(v/1e5).toFixed(2)+' L';
    if(Math.abs(v)>=1e6) return sym+(v/1e6).toFixed(2)+'M';
    if(Math.abs(v)>=1e3) return sym+(v/1e3).toFixed(1)+'k';
  }
  return sym+v.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
}
function money4(usd){
  const v=S.meta.currency==='INR'?usd*fx():usd; const sym=S.meta.currency==='INR'?'₹':'$';
  return sym+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4});
}
function pct(n){return (n||0).toFixed(1)+'%';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function setPath(path, val){
  const p=path.split('.'); let o=S;
  for(let i=0;i<p.length-1;i++){ const k=p[i]; o = /^\d+$/.test(k)?o[+k]:o[k]; }
  const last=p[p.length-1];
  o[/^\d+$/.test(last)?+last:last] = val;
  recalc();
}
function upd(el, path, num){
  let v = el.type==='checkbox'?el.checked:el.value;
  if(num) v = v===''?0:+v;
  setPath(path, v);
}

function applyAzurePreset(stage){
  const target=S.azurePresets[stage]; const cur=calculateAzure().monthlyUSD||1;

}

function scenarioCompute(sc){
  const saved=JSON.stringify(S); const s2=JSON.parse(saved);

  s2.claude.users20x=+sc.aiUsers||s2.claude.users20x; s2.chatgpt.bizUsers=+sc.aiUsers||s2.chatgpt.bizUsers;

  S.meta.claimsPerMonth=+sc.claims||S.meta.claimsPerMonth;

function monthlyModel(months){
  const inv=calculateInvestment(); const hr=inv.hr, az=inv.azure, subs=inv.subs, prodAI=inv.prodAI;
  const secAnn=(inv.sec.annual+inv.comp.annual+inv.legal.annual)/12;
  const cont=(+S.meta.contingencyPct||0)/100;
  const rows=[]; let cum=0;
  const oneTimeMonth1=inv.sec.oneTime+inv.comp.oneTime+inv.legal.oneTime+inv.custom.oneTime+
    (+S.development.testingOneTime||0)+(+S.development.clearinghouseSetup||0);
  for(let m=1;m<=months;m++){
    const scale=1+ (m/months)*0.6; // gentle ramp of runtime as volume grows
    const team=hr.monthlyUSD;
    const azure=az.monthlyUSD*(m<=S.meta.buildMonths?0.7:1)*(m>12?1.3:1);
    const ai=prodAI.total*(m>12?1.3:1);
    const sub=subs.monthlyUSD;
    const ch=inv.chMonthly*(m>12?1.3:1);
    const oneTime=m===1?oneTimeMonth1:0;
    const base=team+azure+ai+sub+ch+secAnn+inv.custom.monthly+oneTime;
    const withCont=base*(1+cont);
    cum+=withCont;
    rows.push({m,team,azure,ai,sub,ch,secAnn,oneTime,total:withCont,cum});
  }
  return rows;
}

      apply:()=>{ const idx=S.prodAI.models.indexOf(cheapest); let moved=15;

        S.prodAI.models[idx].route+=15;}});}

  const pricey=S.azure.services.filter(s=>s.on&&s.mo>=200).sort((a,b)=>b.mo-a.mo)[0];
  if(pricey && S.meta.claimsPerMonth<=50000){
    out.push({label:`Defer "${pricey.svc}" (${pricey.tier}) to production`,detail:'High-cost service not required at MVP scale.',saveMo:pricey.mo,
      apply:()=>{ const i=S.azure.services.indexOf(pricey); S.azure.services[i].on=false; }});}
  // 5. Enable prompt caching
  if(!S.prodAI.caching){ const claims=+S.meta.claimsPerMonth||0;
    out.push({label:'Enable prompt caching',detail:'Cache repeated system/context tokens.',saveMo:calc.perClaim*claims*0.3,
      apply:()=>{S.prodAI.caching=true;}});}
  return out;
}
function approveOpt(i){
  const inv=calculateInvestment(); const opts=optimizationSuggestions(inv);
  if(opts[i]){ opts[i].apply(); toast('Applied: '+opts[i].label); recalc(); }
}

    <td><input type="text" class="wide" value="${esc(s.item)}" oninput="upd(this,'sources.${i}.item')" style="min-width:180px"></td>
    <td><input type="text" class="wide" value="${esc(s.url)}" oninput="upd(this,'sources.${i}.url')" style="min-width:260px"> <a href="${esc(s.url)}" target="_blank" rel="noopener">↗</a></td>
    <td><input type="text" value="${esc(s.date)}" oninput="upd(this,'sources.${i}.date')" style="width:80px"></td>

/* ---------- SETTINGS (custom cost items + persistence + export) ---------- */
VIEWS.settings=function(){
  const custom=calculateCustomItems(); const types=['ONE-TIME','MONTHLY','ANNUAL','PER-USER','PER-TENANT','PER-CLAIM','PER-TRANSACTION','PER-MINUTE','PER-GB','PER-API-CALL','PERCENTAGE','QUOTE REQUIRED'];
  set(`<p class="sec-desc">Custom cost-item engine, persistence and exports. Add any cost with the right cost type — the engine converts it into the model automatically. ${refBadge}</p>
  <div class="card"><div class="hdr"><h3>Custom Cost Items</h3></div>
  <div class="tbl-wrap"><table><thead><tr><th style="width:50px">On</th><th>Name</th><th>Cost Type</th><th class="num">Amount (USD)</th><th class="num">Qty</th><th>Note</th><th></th></tr></thead><tbody>
  ${S.customItems.map((it,i)=>`<tr>
    <td><input type="checkbox" ${it.on!==false?'checked':''} onchange="upd(this,'customItems.${i}.on')"></td>
    <td><input type="text" class="wide" value="${esc(it.name)}" oninput="upd(this,'customItems.${i}.name')" style="min-width:170px"></td>
    <td><select onchange="upd(this,'customItems.${i}.type')">${types.map(t=>`<option ${it.type===t?'selected':''}>${t}</option>`).join('')}</select></td>
    <td class="num"><input type="number" class="mid" value="${it.amount}" oninput="upd(this,'customItems.${i}.amount',true)" ${it.type==='QUOTE REQUIRED'?'disabled':''}></td>
    <td class="num"><input type="number" class="mini" value="${it.qty||1}" oninput="upd(this,'customItems.${i}.qty',true)"></td>
    <td><input type="text" value="${esc(it.note||'')}" oninput="upd(this,'customItems.${i}.note')" style="min-width:120px"></td>
    <td><button class="del" onclick="delRow('customItems',${i})">×</button></td></tr>`).join('')}
  </tbody></table></div>
  <button class="add-row" onclick="S.customItems.push({name:'New cost item',type:'MONTHLY',amount:0,qty:1,on:true,note:'${REF}'});recalc()">+ ADD COST ITEM</button>
  <div class="grid g3" style="margin-top:14px">
    <div class="stat"><div class="l">Custom One-Time</div><div class="v sm">${money(custom.oneTime,{compact:true})}</div></div>
    <div class="stat"><div class="l">Custom Monthly</div><div class="v sm">${money(custom.monthly,{compact:true})}</div></div>
    <div class="stat"><div class="l">Custom Annual</div><div class="v sm">${money(custom.annual,{compact:true})}</div></div>
  </div>
  ${custom.quotes.length?`<div class="warn"><span class="chip quote">QUOTE REQUIRED</span> ${custom.quotes.map(esc).join(', ')} — not added to totals.</div>`:''}
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>Persistence</h3>
      <div class="pill-row">
        <button class="btn p" onclick="saveState()">💾 Save to Browser</button>
        <button class="btn" onclick="loadState()">📂 Load</button>
        <button class="btn dngr" onclick="resetState()">↺ Reset to Defaults</button>
      </div>
      <div class="muted">Saved in this browser via localStorage (key: <code>${STORAGE_KEY}</code>). No data leaves your machine.</div>
    </div>
    <div class="card"><h3>Export / Import</h3>
      <div class="pill-row">
        <button class="btn" onclick="exportJSON()">⬇ Export JSON</button>
        <button class="btn" onclick="exportCSV()">⬇ Export CSV</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">⬆ Import JSON</button>
        <button class="btn" onclick="window.print()">🖨 Print / PDF</button>
      </div>
      <input type="file" id="importFile" class="hidden" accept="application/json" onchange="importJSON(event)">
      <div class="muted">JSON round-trips the full model; CSV exports the computed line items.</div>
    </div>
  </div>
  ${foot()}`);
};

/* =============================================================================
   PERSISTENCE & EXPORT
============================================================================= */
function saveState(){ try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S));toast('Saved to browser ✓');}catch(e){toast('Save failed: '+e.message);} }
function loadState(){ try{const d=localStorage.getItem(STORAGE_KEY); if(!d){toast('No saved state found');return;} S=Object.assign(defaults(),JSON.parse(d)); toast('Loaded ✓'); go(currentRoute);}catch(e){toast('Load failed');} }
function resetState(){ if(confirm('Reset all assumptions to REFERENCE DEFAULTS? This clears your edits.')){ S=defaults(); _teamBase=_azureBase=null; toast('Reset to defaults'); go('dashboard'); } }
function autosave(){ try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S));}catch(e){} }
function setCurrency(c){ S.meta.currency=c; document.getElementById('curUSD').classList.toggle('on',c==='USD'); document.getElementById('curINR').classList.toggle('on',c==='INR'); go(currentRoute); }

function download(name,content,type){ const b=new Blob([content],{type}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); }
function exportJSON(){ download('ARR_OS_cost_model.json',JSON.stringify({state:S,computed:calculateInvestment(),unit:calculateUnitEconomics()},null,2),'application/json'); toast('Exported JSON'); }
function importJSON(ev){ const f=ev.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=e=>{try{const j=JSON.parse(e.target.result); S=Object.assign(defaults(),j.state||j); toast('Imported ✓'); go('dashboard');}catch(err){toast('Invalid JSON');}}; r.readAsText(f); }
function exportCSV(){
  const inv=calculateInvestment(); const ue=calculateUnitEconomics();
  const L=[['Category','Line Item','USD','INR ('+S.meta.fx+'/USD)']];
  const push=(c,i,v)=>L.push([c,i,Math.round(v),Math.round(v*fx())]);
  inv.hr.rows.forEach(h=>push('Human Resources',h.role+' ×'+h.count,h.loadedAnnual));
  push('AI Subscriptions','Claude Max (annual)',inv.subs.claudeMo*12);
  push('AI Subscriptions','ChatGPT (annual)',inv.subs.chatgptMo*12);
  push('Azure','Infrastructure (annual)',inv.azure.monthlyUSD*12);
  push('Production AI','Runtime (annual)',inv.prodAI.total*12);
  push('Security','One-time + annual',inv.sec.oneTime+inv.sec.annual);
  push('Compliance','One-time + annual',inv.comp.oneTime+inv.comp.annual);
  push('Legal','One-time + annual',inv.legal.oneTime+inv.legal.annual);
  L.push([]); push('HEADLINE','MVP Investment',inv.mvp); push('HEADLINE','12-Month',inv.inv12);
  push('HEADLINE','24-Month',inv.inv24); push('HEADLINE','Monthly Burn (Yr1)',inv.monthlyBurn12);
  L.push(['UNIT','All-in cost/claim',ue.allIn.toFixed(4),(ue.allIn*fx()).toFixed(4)]);
  const csv=L.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
  download('ARR_OS_cost_model.csv',csv,'text/csv'); toast('Exported CSV');
}

/* =============================================================================
   TOAST + BOOT
============================================================================= */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

// autosave on any recalc
const _recalc=recalc;
recalc=function(){ _recalc(); autosave(); };

// boot
(function(){
  try{ const d=localStorage.getItem(STORAGE_KEY); if(d) S=Object.assign(defaults(),JSON.parse(d)); }catch(e){}
  renderNav(); go('dashboard');
})();
</script>
