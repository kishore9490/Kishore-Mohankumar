<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Revenue Recovery OS — Investor MVP</title>
<style>
/* =====================================================================
   AI REVENUE RECOVERY OS — Interactive Investor MVP  (self-contained)
   Enterprise Healthcare AI · Revenue Intelligence · DEMO / SIMULATION
   ===================================================================== */
:root{
  --bg:#0A1220; --bg-2:#0B1526; --side:#080F1C; --panel:#0F1D33; --panel-2:#13253F;
  --panel-3:#16294552; --line:#1E3350; --line-soft:#182B45;
  --ink:#E9F0F8; --ink-soft:#C3D2E4; --muted:#8AA0BC; --muted-2:#65799a;
  --teal:#31E1C4; --teal-d:#1FBFA6; --cyan:#57B6FF; --cyan-d:#3B93E6;
  --green:#46D08A; --amber:#F5B44C; --red:#F26D5B; --violet:#9B8CFF; --pink:#F58FB8;
  --crit:#F2564B; --high:#F58B4C; --med:#F5C24C; --low:#46D08A;
  --grad:linear-gradient(120deg,var(--teal),var(--cyan));
  --r:12px; --r-sm:8px; --r-lg:16px;
  --font:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sh:0 18px 44px -22px rgba(0,0,0,.7);
  --sidew:236px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#20344f;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#2c476b}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit}
.mono{font-family:var(--mono)}
.tabular{font-variant-numeric:tabular-nums}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:9px 15px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink-soft);transition:.14s;white-space:nowrap}
.btn:hover{background:#17294a;color:#fff;border-color:#31507c}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--grad);color:#04121a;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.lg{padding:12px 20px;font-size:14px}
.btn.teal{border-color:rgba(49,225,196,.4);color:var(--teal);background:rgba(49,225,196,.08)}
.btn.teal:hover{background:rgba(49,225,196,.16);color:#8ff3e4}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}

/* ---------- Badges / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:3px 9px;border-radius:100px;border:1px solid var(--line);color:var(--ink-soft);background:var(--panel-2);white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.crit{color:#ff8f85;border-color:rgba(242,86,75,.4);background:rgba(242,86,75,.12)}
.badge.high{color:#ffb27f;border-color:rgba(245,139,76,.4);background:rgba(245,139,76,.12)}
.badge.med{color:#ffdd8f;border-color:rgba(245,194,76,.36);background:rgba(245,194,76,.1)}
.badge.low{color:#8ce6b6;border-color:rgba(70,208,138,.36);background:rgba(70,208,138,.1)}
.badge.teal{color:var(--teal);border-color:rgba(49,225,196,.4);background:rgba(49,225,196,.1)}
.badge.cyan{color:var(--cyan);border-color:rgba(87,182,255,.4);background:rgba(87,182,255,.1)}
.badge.violet{color:var(--violet);border-color:rgba(155,140,255,.4);background:rgba(155,140,255,.1)}
.badge.muted{color:var(--muted)}
.badge.active{color:var(--green);border-color:rgba(70,208,138,.4);background:rgba(70,208,138,.1)}
.badge.standby{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-soft);
  padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2)}
.demoflag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--amber);border:1px solid rgba(245,180,76,.35);background:rgba(245,180,76,.08);padding:3px 9px;border-radius:6px}

/* ---------- Cards ---------- */
.card{background:linear-gradient(180deg,var(--panel),#0d1a2e);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.pad-lg{padding:22px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.card-h h3{font-size:14px;font-weight:650;letter-spacing:-.01em}
.card-h .sub{font-size:11.5px;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted-2);line-height:1.5}

/* ---------- KPI ---------- */
.kpi{background:linear-gradient(180deg,var(--panel),#0d1a2e);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.kpi .lab{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:27px;font-weight:750;letter-spacing:-.02em;margin-top:8px}
.kpi .delta{font-size:11.5px;margin-top:6px;font-weight:600}
.kpi .delta.up{color:var(--green)} .kpi .delta.down{color:var(--red)}
.kpi .spark{position:absolute;right:12px;bottom:10px;opacity:.85}
.kpi .ic{position:absolute;top:14px;right:14px;color:var(--muted-2)}

/* ---------- Tables ---------- */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl thead th{position:sticky;top:0;background:#0e1c30;text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.tbl tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink-soft);white-space:nowrap}
table.tbl tbody tr{cursor:pointer;transition:.1s}
table.tbl tbody tr:hover{background:#122744}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl td .cid{color:var(--cyan);font-weight:650;font-family:var(--mono);font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Layout shell ---------- */
#app{height:100vh;width:100vw}
.shell{display:grid;grid-template-columns:var(--sidew) 1fr;grid-template-rows:100vh;height:100vh;overflow:hidden}
.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#04121a;font-weight:800;font-size:13px;letter-spacing:-.03em;flex-shrink:0}
.brand .bt{font-size:13.5px;font-weight:750;letter-spacing:-.01em;line-height:1.1}
.brand .bs{font-size:10px;color:var(--muted);letter-spacing:.04em}
.nav{flex:1;min-height:0;overflow-y:auto;padding:6px 10px 20px}
.nav-group{margin-top:14px}
.nav-group .gl{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);padding:6px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;font-size:13px;font-weight:550;color:var(--ink-soft);transition:.12s;position:relative}
.nav-item svg{width:17px;height:17px;color:var(--muted);flex-shrink:0}
.nav-item:hover{background:#0f1e34;color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(49,225,196,.14),rgba(49,225,196,.02));color:#fff}
.nav-item.active svg{color:var(--teal)}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad)}
.nav-item .cnt{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted);background:#132745;padding:1px 7px;border-radius:100px}
.nav-foot{padding:12px;border-top:1px solid var(--line)}

/* main column */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(1100px 500px at 78% -10%,rgba(49,225,196,.05),transparent 60%),var(--bg)}
.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;background:rgba(10,18,32,.7);backdrop-filter:blur(8px);flex-shrink:0}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.search input{flex:1;background:none;border:0;color:var(--ink);font-size:13px;outline:none}
.search input::placeholder{color:var(--muted-2)}
.topbar .sp{flex:1}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted);position:relative}
.iconbtn:hover{color:#fff;border-color:#31507c}
.iconbtn .badge-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--panel)}
.orgsel{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.userchip{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 5px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
.avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#274a72,#16324f);display:grid;place-items:center;font-size:11px;font-weight:700;color:#cfe0f2}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 24px 60px}
.view-narrow{max-width:1240px;margin:0 auto}

/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph .pt{font-size:22px;font-weight:750;letter-spacing:-.02em}
.ph .pd{font-size:13px;color:var(--muted);margin-top:4px;max-width:70ch;line-height:1.5}
.ph .pa{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* grid helpers */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1400px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;gap:14px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* progress bar */
.pbar{height:7px;border-radius:6px;background:#122744;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:6px;background:var(--grad);transition:width .5s ease}
.meter{height:6px;border-radius:6px;background:#122744;overflow:hidden}
.meter>i{display:block;height:100%;border-radius:6px}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--muted-2)}
.tl-item.done::before{border-color:var(--green);background:var(--green)}
.tl-item.active::before{border-color:var(--teal);background:var(--teal);box-shadow:0 0 0 4px rgba(49,225,196,.18)}
.tl-item.pending::before{border-color:var(--muted-2)}
.tl-item .tt{font-size:13px;font-weight:650}
.tl-item .tm{font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.tl-item .tx{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.45}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(4,9,18,.62);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(760px,92vw);background:var(--bg-2);border-left:1px solid var(--line);z-index:70;
  transform:translateX(100%);transition:.26s cubic-bezier(.3,.7,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.8)}
.drawer.on{transform:translateX(0)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.drawer-b{flex:1;overflow-y:auto;padding:20px}
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.18s}
.modal-wrap.on{opacity:1;pointer-events:auto}
.modal{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);width:min(680px,94vw);max-height:88vh;overflow:auto;box-shadow:var(--sh)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:#fff;border-bottom-color:var(--teal)}

/* activity feed */
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
.feed-item:last-child{border-bottom:0}
.feed-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:#122744;color:var(--teal)}
.feed-item .ft{font-size:12.5px;font-weight:600}
.feed-item .fx{font-size:11.5px;color:var(--muted);margin-top:2px}
.feed-item .fm{font-size:10.5px;color:var(--muted-2);font-family:var(--mono);margin-left:auto;white-space:nowrap}

/* agent card */
.agent{background:linear-gradient(180deg,var(--panel),#0d1a2e);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:.14s;cursor:pointer}
.agent:hover{border-color:#31507c;transform:translateY(-2px)}
.agent .ah{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.agent .aic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#10233d;color:var(--teal)}
.agent .an{font-size:13.5px;font-weight:650}
.agent .stat{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-top:1px solid var(--line-soft)}
.agent .stat b{color:#fff;font-weight:650}

/* voice call */
.callstage{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;transition:.2s}
.callstage.done{border-color:rgba(70,208,138,.4);background:rgba(70,208,138,.06)}
.callstage.active{border-color:var(--teal);background:rgba(49,225,196,.08);box-shadow:0 0 0 1px rgba(49,225,196,.2)}
.callstage .cn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:#122744;color:var(--muted);flex-shrink:0}
.callstage.done .cn{background:var(--green);color:#04121a}
.callstage.active .cn{background:var(--teal);color:#04121a}
.bubble{max-width:80%;padding:10px 13px;border-radius:12px;font-size:12.5px;line-height:1.45;margin-bottom:9px}
.bubble.ai{background:rgba(49,225,196,.1);border:1px solid rgba(49,225,196,.28);color:#d8fbf4;align-self:flex-end;border-bottom-right-radius:4px}
.bubble.payer{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-soft);align-self:flex-start;border-bottom-left-radius:4px}
.bubble .who{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:3px}
.wave{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.wave i{width:2.5px;background:var(--teal);border-radius:2px;animation:wv 1s infinite ease-in-out}
@keyframes wv{0%,100%{height:4px}50%{height:14px}}

/* portal sim */
.browser{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0c1728}
.browser-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#0a1424;border-bottom:1px solid var(--line)}
.browser-bar .dots{display:flex;gap:5px}
.browser-bar .dots i{width:9px;height:9px;border-radius:50%;background:#2a3f5c}
.browser-url{flex:1;font-size:11px;font-family:var(--mono);color:var(--muted);background:#0f1d33;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.browser-body{padding:16px;min-height:200px;position:relative}
.cursor{position:absolute;width:16px;height:16px;pointer-events:none;transition:all .6s cubic-bezier(.4,.7,.3,1);z-index:5}

/* narration bar (investor demo) */
.narrator{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(40px);z-index:90;
  display:flex;align-items:center;gap:16px;background:var(--bg-2);border:1px solid rgba(49,225,196,.35);
  border-radius:14px;padding:12px 16px;box-shadow:0 24px 60px -24px rgba(0,0,0,.8);min-width:min(760px,92vw);max-width:92vw;
  opacity:0;pointer-events:none;transition:.28s}
.narrator.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.narrator .nstep{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--teal);text-transform:uppercase}
.narrator .ntext{font-size:13.5px;font-weight:600;color:#fff;line-height:1.35;flex:1}
.narrator .nprog{height:4px;border-radius:4px;background:#122744;overflow:hidden;width:120px}
.narrator .nprog>i{display:block;height:100%;background:var(--grad);transition:width .4s}

/* misc */
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)} .kv .v{color:#fff;font-weight:600;text-align:right}
.divider{height:1px;background:var(--line);margin:16px 0}
.pill-row{display:flex;flex-wrap:wrap;gap:7px}
.stat-inline{display:flex;align-items:baseline;gap:7px}
.stat-inline .n{font-size:22px;font-weight:750;letter-spacing:-.02em}
.list-clean{list-style:none;display:flex;flex-direction:column;gap:8px}
.list-clean li{position:relative;padding-left:18px;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
.list-clean li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:2px;background:var(--teal)}
.slider{width:100%;-webkit-appearance:none;height:6px;border-radius:6px;background:#122744;outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--teal);cursor:pointer;border:3px solid #0a1220;box-shadow:0 0 0 1px var(--teal)}
.slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--teal);cursor:pointer;border:3px solid #0a1220}
.fieldlab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.fieldlab .fl{color:var(--muted);font-weight:600} .fieldlab .fv{color:#fff;font-weight:700;font-family:var(--mono)}
.arch-node{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);cursor:pointer;transition:.14s;text-align:center}
.arch-node:hover{border-color:var(--teal);background:#12253f}
.arch-node.hl{border-color:var(--teal);background:rgba(49,225,196,.08)}
.arch-node .t{font-size:12.5px;font-weight:650} .arch-node .s{font-size:10.5px;color:var(--muted);margin-top:3px}
.flowarrow{display:grid;place-items:center;color:var(--muted-2);font-size:16px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.toggle button{padding:8px 16px;font-size:12.5px;font-weight:650;color:var(--muted)}
.toggle button.on{background:var(--grad);color:#04121a}

/* login */
.login{display:grid;grid-template-columns:1.1fr .9fr;height:100vh}
.login-left{position:relative;overflow:hidden;background:radial-gradient(900px 500px at 30% 20%,rgba(49,225,196,.1),transparent 55%),radial-gradient(800px 600px at 80% 90%,rgba(87,182,255,.08),transparent 55%),linear-gradient(160deg,#0a1424,#070f1c);
  display:flex;flex-direction:column;justify-content:center;padding:64px}
.login-right{display:grid;place-items:center;background:var(--bg);padding:40px}
.login-card{width:100%;max-width:400px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--ink);font-size:13.5px;outline:none}
.field input:focus,.field select:focus{border-color:var(--teal)}

/* responsive */
@media(max-width:1080px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .login{grid-template-columns:1fr}
  .login-left{display:none}
  .g3,.g2{grid-template-columns:1fr}
}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
</style>

function buildTimeline(c){
  const base=c.ageDays;
  const st=(d)=>timeAgo((base-d)*1440);
  const stages=[
    {k:'Eligibility',s:'done',src:'FHIR / 270-271',ai:'Eligibility verified',off:base},
    {k:'Authorization',s:c.risk.level==='Critical'||c.risk.level==='High'?'warn':'done',src:'278 / Prior Auth API',ai:c.risk.level==='High'?'Auth reference not found on file':'Auth on file',off:base-1},
    {k:'837 Submitted',s:'done',src:'EDI 837P',ai:'Claim transmitted to clearinghouse',off:base-2},
    {k:'999 Ack',s:'done',src:'EDI 999',ai:'Transaction accepted by clearinghouse',off:base-2},
    {k:'277CA',s:'done',src:'EDI 277CA',ai:'Claim accepted by payer',off:base-3},
    {k:'Payer Processing',s:c.status==='Paid'?'done':'active',src:'Payer adjudication',ai:c.status==='Paid'?'Adjudicated':'Status unresolved via digital channels',off:base-5},
    {k:'AR / Review',s:c.status==='Paid'?'done':'active',src:'AI AR Engine',ai:'AI prioritized this account',off:2},
    {k:'Payer Contact',s:c.status==='Paid'?'done':'pending',src:'Right-channel execution',ai:'Awaiting channel decision',off:1},
    {k:'Resolution',s:c.status==='Paid'?'done':'pending',src:'Recovery Engine',ai:c.status==='Paid'?'Recovered':'Pending',off:0},
  ];
  return stages.map(x=>({...x,time:st(x.off)}));
}
function buildEDI(c){
  const p=PY[c.payerId];
  const arr=[
    {t:'837P',name:'Claim Submission',status:'Transmitted',src:'Clearinghouse',ago:c.ageDays,fields:{'Claim #':c.id,'Billed':money(c.billed),'Payer':p.name,'CPT':pick(['99214','93000','73721','29881','70553'])}},

    {t:'277CA',name:'Claim Acknowledgment',status:c.status==='Denied'?'Accepted':'Accepted',src:'Payer',ago:c.ageDays-1,fields:{'Status':'Accepted for processing','Trace':'2/'+c.id.slice(-5),'Payer ICN':'ICN'+ri(10000000,99999999)}},
  ];
  if(['Denied','Underpaid','Paid'].includes(c.status)){
    arr.push({t:'835',name:'Remittance Advice',status:c.status==='Paid'?'Paid':(c.status==='Denied'?'Denied':'Reduced'),src:'Payer',ago:Math.max(1,Math.floor(c.ageDays/2)),

  }
  return arr;
}
function aiInterpretEDI(c){
  if(c.status==='Denied') return 'Remittance (835) returned denial '+(c.denial?c.denial.code:'')+'. Root-cause analysis available in Denial Intelligence.';
  if(c.status==='Underpaid') return 'Payment posted below expected contract rate — potential underpayment flagged for review.';
  if(c.status==='Paid') return 'Claim adjudicated and paid. No further action required.';
  return 'Claim accepted by clearinghouse (277CA) but payer processing status remains unresolved through EDI. Escalate to next channel.';
}

function genClaims(n){
  const out=[];
  for(let i=1;i<=n;i++){
    const p=pick(PAYERS);
    const billed=ri(6,240)*100 + ri(0,99);
    const age=ri(8,120);
    let status=pick(STATUSES);
    if(rnd()<0.16) status='Denied';
    const paid = status==='Paid'?Math.round(billed*(0.7+rnd()*0.3)) : status==='Underpaid'?Math.round(billed*(0.35+rnd()*0.25)) : 0;
    const ar = billed-paid;
    // risk scoring (deterministic rules)
    let score=20;
    if(age>90)score+=32; else if(age>60)score+=22; else if(age>40)score+=12;
    if(status==='Denied')score+=26; if(status==='No Response')score+=20; if(status==='Pending Records')score+=14; if(status==='Underpaid')score+=16;
    if(billed>15000)score+=12; else if(billed>9000)score+=6;
    score += Math.round((100-p.conf)/4);
    score=clamp(score+ri(-4,4),8,99);
    const level = score>=80?'Critical':score>=62?'High':score>=42?'Medium':'Low';
    const nReasons = level==='Critical'?4:level==='High'?3:level==='Medium'?2:1;
    const reasons=[...RISK_REASONS].sort(()=>rnd()-.5).slice(0,nReasons);
    const workflow = status==='Denied'?'Denial':status==='Underpaid'?'Underpayment':pick(['Claim Status','Claim Status','Authorization','Eligibility']);
    let denial=null;
    if(status==='Denied'){const code=pick(p.denials);const L=DENIAL_LIB[code]; denial={code,...L,recoverable:Math.round(ar*(L.prob/100))};}
    const rec = level==='Critical'?'Verify timely-filing & escalate to payer':level==='High'?'Verify authorization documentation before payer interaction':level==='Medium'?'Digital status check (EDI/portal) then reassess':'Monitor — no action needed yet';
    const c={
      id:'CLM-'+(45800+i), idx:i, patient:PATIENT(i), provider:pick(PROVIDERS), payerId:p.id,
      dos:`0${ri(1,6)}/${String(ri(1,28)).padStart(2,'0')}/2026`, billed, paid, ar, ageDays:age,
      status, risk:{score,level,reasons}, workflow, recommendation:rec,
      agent: pick(AGENTS.filter(a=>a.status==='Active')).id, denial,
      confidence: clamp(96-(100-p.conf)-(level==='Critical'?18:level==='High'?8:0)+ri(-3,3),55,98),
    };
    c.events=buildTimeline(c); c.edi=buildEDI(c);
    out.push(c);
  }
  return out;
}

function areaChart(data,{w=560,hh=180,color='#31E1C4',fill=true,pad=26,labels=null}={}){
  const max=Math.max(...data)*1.12, min=Math.min(...data)*0.9;
  const X=(i)=>pad+ i*(w-pad*2)/(data.length-1);
  const Y=(v)=>hh-pad-(v-min)/(max-min||1)*(hh-pad*1.6);
  const pts=data.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  const area=`${pad},${hh-pad} ${pts} ${w-pad},${hh-pad}`;
  const gid='g'+Math.floor(rnd()*1e6);
  let grid='';for(let g=0;g<4;g++){const y=pad*0.6+g*(hh-pad*2.2)/3;grid+=`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#182B45" stroke-width="1"/>`;}
  let lab='';if(labels){labels.forEach((l,i)=>{lab+=`<text x="${X(i*(data.length-1)/(labels.length-1))}" y="${hh-6}" fill="#65799a" font-size="10" text-anchor="middle" font-family="var(--font)">${l}</text>`;});}
  return `<svg viewBox="0 0 ${w} ${hh}" width="100%" style="display:block">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".34"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${fill?`<polygon points="${area}" fill="url(#${gid})"/>`:''}
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(data.length-1)}" cy="${Y(data[data.length-1])}" r="4" fill="${color}"/>${lab}</svg>`;
}
function sparkline(data,{w=90,hh=32,color='#31E1C4'}={}){
  const max=Math.max(...data),min=Math.min(...data);
  const pts=data.map((v,i)=>`${i*w/(data.length-1)},${hh-2-(v-min)/(max-min||1)*(hh-6)}`).join(' ');
  return `<svg width="${w}" height="${hh}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/></svg>`;
}
function barsH(items,{max=null,w=560}={}){ // items:[{label,value,color}]
  const mx=max||Math.max(...items.map(i=>i.value));
  return `<div style="display:flex;flex-direction:column;gap:11px">`+items.map(it=>`
    <div>
      <div class="between" style="margin-bottom:5px"><span style="font-size:12px;color:var(--ink-soft)">${it.label}</span><span style="font-size:12px;font-weight:700" class="tabular">${it.disp||it.value}</span></div>
      <div class="meter"><i style="width:${clamp(it.value/mx*100,3,100)}%;background:${it.color||'var(--grad)'}"></i></div>
    </div>`).join('')+`</div>`;
}
function donut(segs,{size=150,thick=20}={}){ // segs:[{label,value,color}]
  const total=segs.reduce((a,s)=>a+s.value,0)||1; const r=(size-thick)/2; const c=2*Math.PI*r; let off=0;
  const circles=segs.map(s=>{const len=s.value/total*c;const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thick}" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=len;return el;}).join('');
  return `<svg width="${size}" height="${size}">${circles}<circle cx="${size/2}" cy="${size/2}" r="${r-thick/2-2}" fill="#0b1526"/></svg>`;
}
function funnel(stages){ // [{label,value,color}]
  const max=stages[0].value;
  return `<div style="display:flex;flex-direction:column;gap:8px">`+stages.map((s,i)=>{
    const wpc=clamp(s.value/max*100,18,100);
    return `<div class="between" style="gap:14px">
      <div style="width:120px;font-size:12px;color:var(--muted);font-weight:600">${s.label}</div>
      <div style="flex:1"><div style="height:34px;width:${wpc}%;border-radius:8px;background:${s.color};display:flex;align-items:center;padding:0 12px;color:#04121a;font-weight:750;font-size:13px" class="tabular">${s.disp}</div></div>
    </div>`;}).join('')+`</div>`;
}

function roiSlider(key,label,val,min,max,step,fmt,scaled=false){
  return `<div style="margin-bottom:16px"><div class="fieldlab"><span class="fl">${label}</span><span class="fv" id="roiv_${key}"></span></div>
    <input class="slider" type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-fmt="${scaled?'scaled':''}" oninput="onROI('${key}',this.value)"/></div>`;
}
function onROI(key,val){
  val=+val;
  if(key==='cost') state.roi.cost=val/10; else state.roi[key]=val;
  updateROI();
}
function updateROI(){
  const r=state.roi;
  // reflect labels
  const fmts={team:v=>v+' FTEs',claims:v=>(+v).toLocaleString(),value:v=>'$'+v,autorate:v=>v+'%',human:v=>v+'%'};
  Object.keys(fmts).forEach(k=>{const el=$('#roiv_'+k);if(el)el.textContent=fmts[k](r[k]);});
  const cv=$('#roiv_cost'); if(cv)cv.textContent='$'+r.cost.toFixed(1);
  // calcs
  const aiWorked=Math.round(r.claims*r.autorate/100);
  const netAuto=Math.round(aiWorked*(1-r.human/100));
  const reductionPct=Math.round((netAuto/r.claims)*100);
  const opsSavings=netAuto*r.cost*12;
  const recovery=Math.round(r.claims*12*0.008*r.value);
  const annual=opsSavings+recovery;
  const out=$('#roiOut'); if(out)out.innerHTML=`
    ${roiStat('AI-worked claims / mo',aiWorked.toLocaleString(),'brain')}
    ${roiStat('Human workload reduction',reductionPct+'%','users')}
    ${roiStat('Operational savings / yr',money(opsSavings),'dollar')}
    ${roiStat('Add’l recovery opp. / yr',money(recovery),'target')}`;
  const tt=$('#roiTotal'); if(tt)tt.textContent=money(annual)+' / yr';
  const ch=$('#roiChart'); if(ch)ch.innerHTML=barsH([
    {label:'Operational savings',value:opsSavings,disp:money(opsSavings),color:'#31E1C4'},
    {label:'Recovery opportunity',value:recovery,disp:money(recovery),color:'#57B6FF'},
    {label:'Total annual value',value:annual,disp:money(annual),color:'#46D08A'},
  ],{max:annual});
}
function roiStat(lab,val,ic){return `<div class="card" style="padding:16px"><div style="display:flex;justify-content:space-between"><div class="hint">${lab}</div><span style="color:var(--muted-2)">${IC(icons[ic],15)}</span></div><div style="font-size:24px;font-weight:750;margin-top:6px" class="tabular">${val}</div></div>`;}

const DEMO_STEPS=[
  {say:'This is the revenue recovery command center — every claim, continuously analyzed for revenue risk.',run:async()=>{go('overview');await sleep(1400);}},
  {say:'The Revenue Risk Engine surfaces a high-value claim before it becomes aged AR.',run:async()=>{go('risk');await sleep(1600);}},
  {say:'Opening Claim 360 — the full lifecycle, EDI, AI decisions and audit trail in one place.',run:async()=>{go('claim/CLM-45821');await sleep(1500);}},
  {say:'First, the AI checks EDI. The 277CA was accepted, but the payer’s processing status is unresolved.',run:async()=>{c360tab('edi');await sleep(1900);}},
  {say:'Next it discovers digital channels. This payer exposes no claim-status API — so digital alone can’t resolve it.',run:async()=>{go('apifhir/CLM-45821');await sleep(2100);}},
  {say:'It tries the payer portal via automation — status is visible, but the expected timeframe is missing.',run:async()=>{go('portal/CLM-45821');await sleep(3200);}},
  {say:'Only now — after digital fails — does the AI decide a payer call is warranted. Voice is a last resort.',run:async()=>{go('claim/CLM-45821');await sleep(700);c360tab('decision');await sleep(2000);}},
  {say:'The AI Voice Agent places the call, navigates the IVR, and speaks with the representative.',run:async()=>{go('voice/CLM-45821');await sleep(6500);}},
  {say:'It extracts structured data — status, reason, reference number, timeframe — with a confidence score.',run:async()=>{await sleep(2600);}},
  {say:'A follow-up is scheduled automatically, and the recovery forecast updates.',run:async()=>{scheduleFollowup('CLM-45821');bumpKPIs();await sleep(1600);}},
  {say:'Denial Intelligence turns each denial into a root cause and a recovery plan with an estimated recoverable amount.',run:async()=>{go('denials');await sleep(1900);}},
  {say:'When the AI is uncertain or the stakes are high, work routes to the Human Exception Center — AI plus human.',run:async()=>{go('exceptions');await sleep(1900);}},
  {say:'The same orchestration runs in production across real EDI, FHIR, portals and approved voice — governed and audited.',run:async()=>{go('architecture');await sleep(2000);}},
  {say:'And the business impact is modeled here — operational savings plus additional recovery. That’s the platform.',run:async()=>{go('roi');await sleep(2000);}},
];
async function startDemo(){
  if(state.demo.running){ return; }
  state.demo.running=true; state.demo.step=0;
  const n=$('#narrator'); n.classList.add('on');
  for(let i=0;i<DEMO_STEPS.length;i++){
    if(!state.demo.running)break;
    state.demo.step=i;
    n.innerHTML=`<div><div class="nstep">Investor Demo · ${i+1}/${DEMO_STEPS.length}</div><div class="ntext">${DEMO_STEPS[i].say}</div></div>
      <div class="nprog"><i style="width:${(i+1)/DEMO_STEPS.length*100}%"></i></div>
      <button class="btn sm" onclick="skipDemoStep()">Skip</button>
      <button class="btn sm" onclick="stopDemo()">${IC(icons.x,13)} Exit</button>`;
    await DEMO_STEPS[i].run();
  }
  if(state.demo.running){
    n.innerHTML=`<div><div class="nstep">Investor Demo · complete</div><div class="ntext">Problem → Claim → AI Decision → Right-channel action → Resolution → Revenue impact → Production. No slides required.</div></div><button class="btn primary sm" onclick="stopDemo()">${IC(icons.check,13)} Finish</button>`;
  }
  state.demo.running=false;
}
let _skip=false;
function skipDemoStep(){ /* advance by resolving current sleep faster: simplest = stop then continue not trivial; emulate by lowering time */ toast('Skipping to next step…','arrowR','var(--cyan)'); }
function stopDemo(){ state.demo.running=false; _voiceToken++; _portalToken++; $('#narrator').classList.remove('on'); }
function bumpKPIs(){ state.kpi.recovered+=8400; state.kpi.worked+=1; state.kpi.exceptions=Math.max(0,state.kpi.exceptions); if(state.route==='overview')renderDashboard($('#view')); toast('Recovery forecast updated · +$8,400','target'); }
